<div class="py-4">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
    <h2 class="mb-0 admin-page-title">
      <span class="material-icons align-middle me-1">fastfood</span>
      {{ titulo }}
    </h2>
    <div class="d-flex flex-wrap gap-2">
      <a routerLink="/admin/candy" class="btn btn-outline-primary btn-sm">
        <span class="material-icons">list</span>
        Ver listado
      </a>
      <a routerLink="/admin" class="btn btn-outline-secondary btn-sm">← Volver al panel</a>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border"></div>
  </div>

  <div class="row justify-content-center" *ngIf="!cargando">
    <div class="col-12 col-lg-8 col-xl-6">
      <div class="card app-card">
        <div class="card-header">
          <h5 class="mb-0">{{ titulo }}</h5>
          <p class="text-muted mb-0 small mt-1" *ngIf="editandoId">Combo #{{ editandoId }}</p>
        </div>
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="guardar()" class="form-compacto" novalidate>
            <div class="mb-2">
              <label class="form-label" for="nombreCombo">Nombre *</label>
              <input
                id="nombreCombo"
                class="form-control"
                formControlName="nombre"
                placeholder="Ej.: Combo Clásico" />
            </div>

            <div class="mb-2">
              <label class="form-label" for="descCombo">Descripción</label>
              <input
                id="descCombo"
                class="form-control"
                formControlName="descripcion"
                placeholder="Balde + gaseosa…" />
            </div>

            <div class="row g-2">
              <div class="col-md-6 mb-2">
                <label class="form-label" for="precioCombo">Precio *</label>
                <input id="precioCombo" type="number" class="form-control" formControlName="precio" min="1" />
              </div>
              <div class="col-md-6 mb-2">
                <label class="form-label" for="iconoCombo">Ícono Material</label>
                <input id="iconoCombo" class="form-control" formControlName="icono" placeholder="fastfood" />
              </div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" formControlName="activo" id="activoCombo" />
              <label class="form-check-label" for="activoCombo">Activo (visible en checkout)</label>
            </div>

            <div class="form-acciones d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="guardando">
                {{ guardando ? 'Guardando…' : (editandoId ? 'Actualizar combo' : 'Crear combo') }}
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="cancelar()" [disabled]="guardando">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
