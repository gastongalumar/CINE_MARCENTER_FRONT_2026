<div class="minimal-login d-flex align-items-center justify-content-center" style="min-height:80vh; padding: 1rem;">
  <div class="card p-4 shadow-lg glass-login-card" style="max-width:440px; width:100%;">
    <div class="text-center mb-4">
      <div class="login-logo-container mb-3" *ngIf="logoUrl">
        <img [src]="logoUrl" alt="Cinemacenter" class="login-logo" [style.width.px]="logoSizePx" [style.opacity]="temaActual?.logoOpacity || '1'" (error)="logoUrl = ''" />
      </div>
      <div class="login-logo-fallback mb-3" *ngIf="!logoUrl">
        <span class="material-icons fallback-logo-icon">movie</span>
      </div>
      <h2 class="mb-1 text-center font-weight-bold fs-4">Iniciar Sesión</h2>
      <p class="text-muted small mb-0">Bienvenido de vuelta, ingresa tus credenciales</p>
    </div>

    <div class="card-body p-0">
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="email" class="form-label small">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><span class="material-icons font-icon-sm">email</span></span>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="credentials.email" required placeholder="correo@ejemplo.com" />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><span class="material-icons font-icon-sm">lock</span></span>
            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="credentials.password" required placeholder="••••••••" />
          </div>
        </div>

        <div *ngIf="loginError" class="alert alert-danger py-2 small mb-3">{{ loginError }}</div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary py-2 btn-login-submit" [disabled]="!loginForm.form.valid || loading">
            {{ loading ? 'Iniciando...' : 'Ingresar' }} <span class="material-icons font-icon-sm">login</span>
          </button>
        </div>

        <div class="d-flex align-items-center gap-2 my-3 oauth-divider">
          <hr class="flex-grow-1 m-0" />
          <span class="text-muted small">o</span>
          <hr class="flex-grow-1 m-0" />
        </div>

        <div class="d-grid mb-3">
          <button type="button" class="btn btn-google py-2" (click)="continuarConGoogle()">
            <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                 width="18" height="18" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continuar con Google
          </button>
        </div>

        <div class="text-center mt-3">
          <a routerLink="/registro" class="text-muted small btn-register-link">¿No tienes cuenta? <span class="text-accent-gold">Regístrate</span></a>
        </div>
      </form>
    </div>
  </div>
</div>
