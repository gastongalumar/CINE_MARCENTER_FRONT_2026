<div class="confirm-dialog">
  <div class="confirm-icon" [class.danger]="data.danger">
    <span class="material-icons">{{ data.icon || (data.danger ? 'warning' : 'help') }}</span>
  </div>

  <h2 class="confirm-title">{{ data.title }}</h2>
  <p class="confirm-message">{{ data.message }}</p>

  <div class="confirm-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelar()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button type="button" class="btn" [class.btn-danger]="data.danger" [class.btn-primary]="!data.danger"
            (click)="confirmar()">
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
