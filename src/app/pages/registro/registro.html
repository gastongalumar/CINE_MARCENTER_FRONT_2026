<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 85vh;">
  <div class="card p-4 shadow-lg glass-register-card" style="max-width: 580px; width: 100%;">
    <div class="text-center mb-4">
      <div class="register-icon-container mb-3">
        <span class="material-icons fallback-register-icon">person_add</span>
      </div>
      <h2 class="mb-1 font-weight-bold fs-4">Crear Cuenta</h2>
      <p class="text-muted small mb-0">Completa tus datos para registrarte en Cinemacenter</p>
    </div>

    <div class="card-body p-0">
      <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label small">Nombre</label>
            <div class="input-group">
              <span class="input-group-text"><span class="material-icons font-icon-sm">person</span></span>
              <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="userData.nombre" required placeholder="Juan">
            </div>
          </div>

          <div class="col-md-6">
            <label for="apellido" class="form-label small">Apellido</label>
            <div class="input-group">
              <span class="input-group-text"><span class="material-icons font-icon-sm">person</span></span>
              <input type="text" class="form-control" id="apellido" name="apellido" [(ngModel)]="userData.apellido" required placeholder="Pérez">
            </div>
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label for="email" class="form-label small">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><span class="material-icons font-icon-sm">email</span></span>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="userData.email" required email placeholder="juan.perez@ejemplo.com">
          </div>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label small">Teléfono (Opcional)</label>
          <div class="input-group">
            <span class="input-group-text"><span class="material-icons font-icon-sm">phone</span></span>
            <input type="tel" class="form-control" id="telefono" name="telefono" [(ngModel)]="userData.telefono" placeholder="+54 9 11 1234-5678">
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="password" class="form-label small">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><span class="material-icons font-icon-sm">lock</span></span>
              <input type="password" class="form-control" id="password" name="password" [(ngModel)]="userData.password" required minlength="6" placeholder="Mín. 6 caracteres">
            </div>
          </div>

          <div class="col-md-6">
            <label for="confirmPassword" class="form-label small">Confirmar Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><span class="material-icons font-icon-sm">lock_reset</span></span>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Repetir contraseña">
            </div>
            <div *ngIf="userData.password !== confirmPassword && confirmPassword" class="text-danger small mt-1">
              Las contraseñas no coinciden
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button
            type="submit"
            class="btn btn-primary py-2 btn-register-submit"
            [disabled]="!registroForm.form.valid || userData.password !== confirmPassword || loading">
            {{ loading ? 'Registrando...' : 'Registrarse' }} <span class="material-icons font-icon-sm">how_to_reg</span>
          </button>

          <a routerLink="/login" class="btn btn-secondary py-2">
            ¿Ya tienes cuenta? Inicia Sesión
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
